<h1>{{ product.name }}</h1>

<div class="product-details">
  <div class="image-box">
    <img
            class="iiz"
            [src]="product.image"
            [alt]="product.name"
          />
  </div>

  <div>
    <h2>{{ product.price }} zł</h2>
    <p>{{ product.description }}</p>
    <p>Ocena: {{ product.rating }} / 5</p>
    <button (click)="addToCart()">
  Dodaj do koszyka
</button>

    <a routerLink="/cart">Przejdź do koszyka</a>
  </div>
</div>

<h2>Pozostałe produkty</h2>


<div class="carousel">
  @for (item of otherProducts; track item.id) {
    <div class="carousel-item">
      <a [routerLink]="['/product', item.id]">
        <img [src]="item.image" [alt]="item.name">
        <h3>{{ item.name }}</h3>
        <p>{{ item.price }} zł</p>
      </a>
    </div>
  }
</div>
