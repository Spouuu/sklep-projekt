
<h2>Koszyk</h2>

@if (cart.length === 0) {
  <h3>KOSZYK JEST PUSTY</h3>
} @else {
  @for (item of cart; track item.product.id) {
    <div>
      <p>
        {{ item.product.name }} -
        {{ item.product.price }} zł
      </p>

      <button (click)="onChangeAmount(item.product, -1)" class="amount">
        -
      </button>

      {{ item.amount }}

      <button (click)="onChangeAmount(item.product, 1)"class="amount">
        +
      </button>

      <button (click)="onDeleteProductFromCard(item.product)">
        Usuń
      </button>
    </div>
  }
}

<h3 class="razem">Razem: {{ getTotal() }} zł</h3>
