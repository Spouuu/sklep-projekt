<h1>Płatność</h1>

<form (ngSubmit)="pay()">
  <label>
    Imię i nazwisko:
    <input name="name" required>
  </label>

  <br>

  <label>
    E-mail:
    <input name="email" type="email" required>
  </label>

  <br>

  <button type="submit">Zapłać</button>
</form>

@if (errorMessage) {
  <p class="error">{{ errorMessage }}</p>
}
